name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity for the fixture repository
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run pytest
        env:
          PYTHONIOENCODING: utf-8

  install-linux:
    name: Installer (Linux, clean machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv kurulu değil: install.sh onu da kendisi kurmalı.
      - run: ./install.sh --lang en --no-setup --no-modify-path
      - run: |
          BIN="$("$HOME/.local/bin/uv" tool dir --bin)"
          "$BIN/gitex" --version
          "$BIN/gitex" --help | grep -q "Ask your Git history"
          "$BIN/gitex" doctor --offline || test $? -eq 1

  install-windows:
    name: Installer (Windows, clean machine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          .\install.ps1 -Lang en -NoSetup -NoModifyPath
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bin = (& "$env:USERPROFILE\.local\bin\uv.exe" tool dir --bin).Trim()
          & "$bin\gitex.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
