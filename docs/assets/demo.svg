<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="gitex ask demo: rate limiting answered with verified commit sources">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151A2D"/>
      <stop offset="1" stop-color="#0D1120"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; font-size: 14px; }
      .p { fill: #E2E8F0; }
      .dim { fill: #64748B; }
      .cmd { fill: #F8FAFC; font-weight: 600; }
      .ps { fill: #2DD4BF; font-weight: 700; }
      .str { fill: #FCD34D; }
      .tool { fill: #94A3B8; }
      .sha { fill: #A5B4FC; font-weight: 600; }
      .h { fill: #F8FAFC; font-weight: 700; }
      .ok { fill: #34D399; }
    </style>
  </defs>
  <rect x="10" y="10" width="860" height="446" rx="14" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="860" height="38" rx="14" fill="#1E2438"/>
  <rect x="10" y="34" width="860" height="14" fill="#1E2438"/>
  <circle cx="36" cy="29" r="6.5" fill="#FF5F57"/>
  <circle cx="58" cy="29" r="6.5" fill="#FEBC2E"/>
  <circle cx="80" cy="29" r="6.5" fill="#28C840"/>
  <text x="440" y="34" text-anchor="middle" class="dim" style="font-size:13px">~/projects/shop — gitex</text>

  <text x="34" y="82"><tspan class="ps">❯</tspan><tspan class="cmd"> gitex ask </tspan><tspan class="str">"When was rate limiting added to login, and why?"</tspan></text>
  <text x="34" y="110" class="tool">  → pickaxe(term='RATE_LIMIT')</text>
  <text x="34" y="132" class="tool">  → search_commits(query='rate limit')</text>
  <text x="34" y="154" class="tool">  → get_commit(sha='6b1285f')</text>

  <text x="34" y="190" class="p">Rate limiting was introduced in <tspan class="sha">6b1285f</tspan> (2026-01-20, Mehmet Demir): a per-IP</text>
  <text x="34" y="212" class="p">cap of 5 login attempts per minute, added after a security audit finding</text>
  <text x="34" y="234" class="p">on brute-force attempts. It was raised to 10 in <tspan class="sha">c17ca5f</tspan> (2026-03-15) —</text>
  <text x="34" y="256" class="p">per the commit message, users behind corporate NAT were being blocked.</text>

  <text x="34" y="294" class="h">Sources</text>
  <text x="34" y="318" class="p">  • <tspan class="sha">6b1285f</tspan> — 2026-01-20 — Mehmet Demir — Login'e rate limit eklendi</text>
  <text x="34" y="340" class="p">  • <tspan class="sha">c17ca5f</tspan> — 2026-03-15 — Mehmet Demir — Rate limit 5'ten 10'a çıkarıldı</text>

  <text x="34" y="378" class="ok">✓ 2 sources verified against the index</text>
  <text x="34" y="400" class="dim">  agent mode · 3 tool calls · every SHA checked before printing</text>
  <text x="34" y="436"><tspan class="ps">❯</tspan><tspan class="p"> </tspan><tspan class="p" opacity="0.7">▍</tspan></text>
</svg>
