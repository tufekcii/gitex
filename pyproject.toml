[project]
name = "gitsor"
version = "0.1.0"
description = "Git geçmişini doğal dilde sorgulayan CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "openai>=3.39.0",
    "anthropic>=2.3.0",
    "python-gitlab>=8.6.0",
]

[project.optional-dependencies]

[project.scripts]
gitsor = "gitsor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "responses>=0.26.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitsor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = [
    "B008",    # typer.Option() varsayılan argümanlarda kullanılır
    "E501",    # satır uzunluğunu `ruff format` yönetir; kalanlar bölünemeyen metinler
    "RUF001", "RUF002", "RUF003",  # Türkçe metinlerdeki ı, ş vb. karakterler
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
