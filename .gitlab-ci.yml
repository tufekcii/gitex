image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

before_script:
  - apt-get update -qq && apt-get install -y -qq git > /dev/null
  - git config --global user.name ci && git config --global user.email ci@example.com
  - uv sync --locked

stages: [check]

lint:
  stage: check
  script:
    - uv run ruff check .
    - uv run ruff format --check .

typecheck:
  stage: check
  script:
    - uv run mypy

test:
  stage: check
  script:
    - uv run pytest

install:
  stage: check
  # install.sh'in temiz bir makinede uçtan uca çalıştığını doğrular.
  script:
    - ./install.sh --no-setup --no-modify-path
    - "$(uv tool dir --bin)/gitex" --version
    - "$(uv tool dir --bin)/gitex" doctor --offline || test $? -eq 1
